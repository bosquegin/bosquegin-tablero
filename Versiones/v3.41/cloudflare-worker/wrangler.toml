name = "bosquegin-actualizar"
main = "src/worker.js"
compatibility_date = "2024-11-01"

[vars]
GITHUB_OWNER = "bosquegin"
GITHUB_REPO = "bosquegin-tablero"
WORKFLOW_FILE = "actualizar.yml"

# El PAT con permiso "Actions: write" + "Contents: read" se carga como
# secreto (NO va en este archivo):
#   wrangler secret put GH_TOKEN

# Usuarios (password_hash/salt/cloud_token) -- NO en el repo git, el repo
# es público. Namespace creado a mano en el dashboard de Cloudflare
# (Workers & Pages -> Storage & Databases -> KV) y conectado acá con el
# binding "AUTH_KV" (Settings -> Bindings del Worker). Si se recrea desde
# cero, reemplazar el id de abajo por el que muestre el dashboard.
[[kv_namespaces]]
binding = "AUTH_KV"
id = "CREAR_EN_DASHBOARD_Y_PEGAR_ID_ACA"
